# CI for NextIteration.SpectreConsole.Auth.Providers.
# Canonical shape defined in NextIteration.Standards STANDARD.md section 3 — change it
# there first, then here.
#
# The single required status check is `ci`, the aggregating gate below. `build` and `test`
# must NOT be required directly: `test` is a matrix, so its check names carry the matrix
# values and change whenever the matrix does. The gate's name is stable.
#
# Two documented deviations from the canonical template, both in NextIteration.Standards
# EXCEPTIONS.md because this is the estate's only multi-package repo:
#   - §3.2: four per-package release tag prefixes (adobe-v*, airtable-v*, softwareone-v*,
#     github-v*) rather than a single v*, so a tag can name which package ships.
#   - §3.0.1: the publish job carries one extra step, "Keep only the tagged package's
#     nupkgs", so a per-package tag publishes only its own package. Every other line of
#     the job is the canonical template verbatim.
name: CI

on:
  push:
    branches: [ main ]
    tags: [ 'adobe-v*', 'airtable-v*', 'softwareone-v*', 'github-v*' ]
  pull_request:
    branches: [ main ]

# Superseded pushes are cancelled. Tag builds are never cancelled — a half-cancelled
# release can leave an incomplete package set on nuget.org.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # Both SDKs: shipping projects target net8.0 and net10.0 and the tests run
      # against BOTH (STANDARD.md 2.3), which needs the 8.0 runtime present.
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/Directory.Packages.props', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Pack
        run: dotnet pack --configuration Release --no-build --output ./artifacts

      - name: Upload package artifact
        uses: actions/upload-artifact@v7
        with:
          name: nuget-package
          # Both .nupkg and .snupkg, so the publish job's glob also pushes symbols.
          path: ./artifacts/*nupkg

  test:
    strategy:
      fail-fast: false        # one platform failing must not hide another's result
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/Directory.Packages.props', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      # Tests run across every shipped TFM (STANDARD.md 2.3). No --no-build: this job
      # does not share a filesystem with `build`, and rebuilding is cheaper and less
      # fragile than shipping obj/ between jobs.
      # `-- --coverage` passes through to Microsoft.Testing.Platform's coverage
      # extension (STANDARD.md 2.6). Referencing a collector without invoking it is
      # worse than none: it reads as coverage in the dependency list while producing
      # no data.
      - name: Test
        run: dotnet test --configuration Release --verbosity normal -- --coverage

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.os }}
          path: '**/TestResults/*.coverage'
          if-no-files-found: warn

  # THE required status check. Aggregates everything above so the ruleset never has to
  # know the matrix shape. `if: always()` is essential — without it the gate is skipped
  # when a dependency fails, and a skipped check reads as success to branch protection.
  ci:
    needs: [ build, test ]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify every required job succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ',') }}
        run: |
          echo "upstream results: $RESULTS"
          case "$RESULTS" in
            *failure*|*cancelled*|*skipped*)
              echo "::error title=CI gate::an upstream job did not succeed ($RESULTS)"
              exit 1 ;;
          esac
          echo "all upstream jobs succeeded"

  publish:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: startsWith(github.ref, 'refs/tags/')

    permissions:
      id-token: write   # GitHub OIDC token issuance for NuGet trusted publishing
      contents: read

    steps:
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - uses: actions/download-artifact@v8
        with:
          name: nuget-package
          path: ./artifacts

      # DEVIATION (STANDARD.md 3.0.1, EXCEPTIONS.md): this repo ships four independently
      # versioned packages, so a per-package tag must publish only its own package. The
      # build job packs all four into the artifact; this step deletes every package except
      # the one whose name matches the tag prefix, leaving the canonical push below to
      # upload exactly one. None of the four package ids is a prefix of another.
      - name: Keep only the tagged package's nupkgs
        run: |
          ref="${GITHUB_REF_NAME}"
          case "$ref" in
            adobe-v*)       keep="NextIteration.SpectreConsole.Auth.Providers.Adobe" ;;
            airtable-v*)    keep="NextIteration.SpectreConsole.Auth.Providers.Airtable" ;;
            softwareone-v*) keep="NextIteration.SpectreConsole.Auth.Providers.SoftwareOne" ;;
            github-v*)      keep="NextIteration.SpectreConsole.Auth.Providers.GitHub" ;;
            *) echo "::error title=publish::Unrecognised tag prefix: $ref"; exit 1 ;;
          esac
          echo "Publishing only $keep for tag $ref"
          find ./artifacts -type f \( -name '*.nupkg' -o -name '*.snupkg' \) ! -name "$keep.*" -print -delete

      # Exchanges the OIDC token for a short-lived (1h) nuget.org key. Requires a
      # Trusted Publishing policy on nuget.org bound to this repo + workflow file.
      # NUGET_USER is the nuget.org account name, not an email.
      - name: NuGet login (OIDC to temporary API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish to NuGet
        run: >
          dotnet nuget push "./artifacts/*.nupkg"
          --api-key "${{ steps.login.outputs.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
